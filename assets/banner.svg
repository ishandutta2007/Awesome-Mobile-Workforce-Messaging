<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes pulseParticle {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.3); }
      }
      @keyframes waveFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -100; }
      }
      .bg-wave {
        stroke: url(#titleGrad);
        stroke-width: 2;
        fill: none;
        opacity: 0.25;
        stroke-dasharray: 10 15;
        animation: waveFlow 20s linear infinite;
      }
      .floating-card {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .particle {
        animation: pulseParticle 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>

  <!-- Dynamic Background Element: Waves (Layered behind text) -->
  <path class="bg-wave" d="M -100 240 Q 200 120 500 220 T 1100 180 T 1300 260"/>
  <path class="bg-wave" d="M -100 280 Q 300 160 700 260 T 1200 200" style="animation-duration: 15s; opacity:0.15;"/>

  <!-- Background Decorative Glowing Orbs -->
  <circle cx="150" cy="80" r="90" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1050" cy="240" r="110" fill="#c084fc" opacity="0.12" filter="url(#glow)"/>

  <!-- Ambient Dynamic Floating Particles (Low opacity, behind text) -->
  <circle class="particle" cx="220" cy="70" r="4" fill="#38bdf8" style="animation-delay: 0s;"/>
  <circle class="particle" cx="980" cy="90" r="5" fill="#818cf8" style="animation-delay: 1s;"/>
  <circle class="particle" cx="150" cy="250" r="3" fill="#c084fc" style="animation-delay: 2s;"/>
  <circle class="particle" cx="850" cy="270" r="4" fill="#38bdf8" style="animation-delay: 1.5s;"/>

  <!-- Subtle Side Decorative Graphic Cards (Kept to far edges to ensure text clarity) -->
  <g class="floating-card" transform="translate(45, 110)">
    <rect width="140" height="100" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <rect x="16" y="20" width="60" height="8" rx="4" fill="#38bdf8" opacity="0.8"/>
    <rect x="16" y="38" width="108" height="6" rx="3" fill="#94a3b8" opacity="0.4"/>
    <rect x="16" y="52" width="90" height="6" rx="3" fill="#94a3b8" opacity="0.4"/>
    <rect x="16" y="66" width="70" height="6" rx="3" fill="#94a3b8" opacity="0.4"/>
  </g>

  <g class="floating-card" transform="translate(1015, 90)" style="animation-delay: -3s;">
    <rect width="140" height="110" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="35" cy="35" r="12" fill="#818cf8" opacity="0.8"/>
    <rect x="56" y="30" width="60" height="8" rx="4" fill="#c084fc" opacity="0.8"/>
    <rect x="20" y="60" width="100" height="6" rx="3" fill="#94a3b8" opacity="0.4"/>
    <rect x="20" y="74" width="80" height="6" rx="3" fill="#94a3b8" opacity="0.4"/>
  </g>

  <!-- FOREGROUND CONTENT: Clear, Unobstructed Title, Subtitle, and Feature Badges -->
  <g text-anchor="middle">
    <!-- Icon / Badge above title -->
    <g transform="translate(600, 55)">
      <rect x="-110" y="-16" width="220" height="32" rx="16" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="1">
        📱 FRONTLINE &amp; DESKLESS TECH
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
      Awesome Mobile Workforce Messaging
    </text>

    <!-- Subtitle -->
    <text x="600" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      Curated SaaS Platforms &amp; Open-Source Team Messaging for Frontline Workers
    </text>

    <!-- Visual Feature Pills in Foreground -->
    <g transform="translate(600, 230)">
      <!-- Pill 1 -->
      <g transform="translate(-230, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
        <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">
          ☁️ SaaS &amp; Enterprise
        </text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(0, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
        <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">
          🔓 Open-Source Solutions
        </text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(230, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
        <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">
          ⚡ Shift &amp; Task Workflows
        </text>
      </g>
    </g>
  </g>
</svg>
